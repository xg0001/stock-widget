<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>任务栏行情</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    /* 半透明玻璃胶囊：保留「透明感」，同时让文字有稳定的对比度（深浅任务栏都好看） */
    #bar {
      -webkit-app-region: drag;
      position: absolute; left: 0; right: 0; top: 1px; bottom: 1px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 0 8px; box-sizing: border-box;
      border-radius: 9px;
      background: linear-gradient(180deg, rgba(30, 35, 48, 0.78) 0%, rgba(15, 18, 26, 0.86) 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      font: 600 12px/1 "Microsoft YaHei", "Segoe UI", sans-serif;
      color: #f4f7fc;
      transition: background 0.16s ease, border-color 0.16s ease;
    }
    #bar:hover {
      background: linear-gradient(180deg, rgba(40, 47, 63, 0.86) 0%, rgba(22, 26, 36, 0.92) 100%);
      border-color: rgba(255, 255, 255, 0.24);
    }
    /* 纯 CSS 小三角，比 Unicode 箭头更锐利 */
    #arrow { width: 0; height: 0; border-left: 3.5px solid transparent; border-right: 3.5px solid transparent; }
    #arrow.up { border-bottom: 5px solid #ff6b61; }
    #arrow.down { border-top: 5px solid #35d68f; }
    #arrow.flat { display: none; }
    #name { max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; opacity: 0.92; }
    #price { font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.2px; }
    #pct {
      padding: 2px 5px; border-radius: 5px; font-weight: 800;
      font-variant-numeric: tabular-nums; background: rgba(255, 255, 255, 0.07);
    }
    #pct.up { color: #ff8a80; background: rgba(255, 107, 97, 0.16); box-shadow: inset 0 0 0 1px rgba(255, 107, 97, 0.22); }
    #pct.down { color: #4ce0a1; background: rgba(53, 214, 143, 0.15); box-shadow: inset 0 0 0 1px rgba(53, 214, 143, 0.22); }
    #pct.flat { color: #c3cbd8; }
    .waiting { color: #9aa3b2; }
  </style>
</head>
<body>
  <div id="bar">
    <span id="arrow" class="flat"></span>
    <span id="name" class="waiting">等待行情…</span>
    <span id="price"></span>
    <span id="pct"></span>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const nameEl = document.getElementById('name');
    const priceEl = document.getElementById('price');
    const pctEl = document.getElementById('pct');
    const arrowEl = document.getElementById('arrow');
    ipcRenderer.on('ticker-data', (e, d) => {
      if (!d) return;
      nameEl.textContent = d.name || d.code || '';
      nameEl.classList.remove('waiting');
      nameEl.title = d.tip || '';
      if (typeof d.price !== 'number' || isNaN(d.price)) {
        priceEl.textContent = ''; pctEl.textContent = ''; arrowEl.className = 'flat';
        return;
      }
      priceEl.textContent = d.price.toFixed(2);
      const up = d.pct > 0, down = d.pct < 0;
      pctEl.textContent = (up ? '+' : '') + d.pct.toFixed(2) + '%';
      pctEl.className = up ? 'up' : down ? 'down' : 'flat';
      arrowEl.className = up ? 'up' : down ? 'down' : 'flat';
    });
  </script>
</body>
</html>
