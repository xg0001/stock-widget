<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景卡 -->
  <rect x="14" y="14" width="228" height="228" rx="54" fill="url(#bg)"/>
  <!-- 顶部高光（让卡片有立体玻璃感） -->
  <path d="M14 68 a54 54 0 0 1 54 -54 h124 a54 54 0 0 1 54 54 v6 a236 60 0 0 0 -236 0 z" fill="url(#hi)"/>
  <!-- 内描边高光 -->
  <rect x="14" y="14" width="228" height="228" rx="54" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>

  <!-- 面积（涨） -->
  <path d="M56 178 L92 150 L124 164 L156 120 L200 80 L200 202 L56 202 Z" fill="url(#area)"/>
  <!-- 上升折线 -->
  <path d="M56 178 L92 150 L124 164 L156 120 L200 80" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 末端圆点（绿涨） -->
  <circle cx="200" cy="80" r="12" fill="#ffffff"/>
  <circle cx="200" cy="80" r="12" fill="none" stroke="#34d399" stroke-width="5"/>
</svg>
